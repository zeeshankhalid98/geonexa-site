<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEONEXA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============================================================
   GEONEXA - Complete CSS
   Theme: White background · Dark Navy Blue · Aqua Green
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ---- CORE PALETTE ---- */
  --navy:       #0d2137;   /* dark navy blue — topbar, nav, headings */
  --navy2:      #133150;   /* medium navy — secondary surfaces        */
  --navy3:      #1a4068;   /* lighter navy — stat cards, table headers*/
  --navy4:      #1e5080;   /* hover navy                              */
  --aqua:       #00c9a7;   /* aqua green — primary accent             */
  --aqua2:      #00b896;   /* aqua hover                              */
  --aqua-light: #e6faf7;   /* aqua tint background                    */
  --aqua-mid:   #b3f0e6;   /* aqua mid for chips                      */

  /* ---- BACKGROUND (white-based) ---- */
  --bg:         #f4f7fa;   /* page background — soft white            */
  --bg2:        #ffffff;   /* card/surface white                      */
  --bg3:        #eef2f7;   /* input / subtle surface                  */
  --bg4:        #dde4ed;   /* hover surface                           */

  /* ---- TEXT ---- */
  --text:       #0d2137;   /* primary text — navy                     */
  --text2:      #3a5a7a;   /* secondary text                          */
  --text3:      #7a9bb8;   /* muted / placeholder                     */

  /* ---- BORDERS ---- */
  --border:     #cdd9e8;   /* default border                          */
  --border2:    #b0c4d8;   /* stronger border                         */

  /* ---- ACCENT COLORS ---- */
  --accent:     #0d2137;   /* navy — primary buttons                  */
  --accent2:    #00c9a7;   /* aqua — success / results                */
  --accent3:    #f59e0b;   /* amber — warnings                        */
  --accent4:    #ef4444;   /* red — errors / danger                   */

  /* ---- CARD ---- */
  --card:       #ffffff;

  /* ---- RADIUS ---- */
  --radius:     12px;
  --radius2:    7px;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  font-size:14px;
  min-height:100vh;
}
#app{display:flex;flex-direction:column;min-height:100vh}

/* ---- TOP BAR ---- */
.topbar{
  background:var(--navy);
  border-bottom:3px solid var(--aqua);
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:200;
  box-shadow:0 2px 16px rgba(13,33,55,0.18);
}
.logo{font-size:22px;font-weight:800;color:#ffffff;letter-spacing:1px}
.logo span{color:var(--aqua)}
.logo-sub{font-size:11px;color:rgba(255,255,255,0.55);margin-top:1px;letter-spacing:0.3px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge{background:var(--aqua);color:var(--navy);font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}

/* ---- NAV ---- */
.nav{
  background:var(--navy2);
  border-bottom:1px solid rgba(0,201,167,0.2);
  display:flex;
  overflow-x:auto;
  gap:2px;
  padding:0 8px;
  scrollbar-width:thin;
  scrollbar-color:var(--navy3) transparent;
}
.nav::-webkit-scrollbar{height:3px}
.nav::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:3px}
.nav-btn{
  padding:10px 14px;
  font-size:13px;
  color:rgba(255,255,255,0.6);
  background:none;
  border:none;
  cursor:pointer;
  white-space:nowrap;
  border-bottom:2px solid transparent;
  transition:all 0.15s;
  font-weight:500;
}
.nav-btn:hover{color:#fff;background:rgba(0,201,167,0.08)}
.nav-btn.active{color:var(--aqua);border-bottom-color:var(--aqua);font-weight:700}

/* ---- MAIN CONTENT ---- */
.main{flex:1;padding:16px;max-width:1200px;margin:0 auto;width:100%}

/* ---- CARDS ---- */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 1px 6px rgba(13,33,55,0.07);
}
.card-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:14px;
  color:var(--navy);
  display:flex;
  align-items:center;
  gap:8px;
}

/* ---- GRID SYSTEM ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:600px){
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
}
@media(max-width:800px){
  .grid3,.grid4{grid-template-columns:1fr 1fr}
}

/* ---- STAT CARDS ---- */
.stat-card{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  border-radius:var(--radius2);
  padding:18px;
  text-align:center;
  border:1px solid rgba(0,201,167,0.2);
  box-shadow:0 2px 10px rgba(13,33,55,0.12);
}
.stat-val{font-size:28px;font-weight:800;color:var(--aqua)}
.stat-lbl{font-size:12px;color:rgba(255,255,255,0.6);margin-top:5px;font-weight:500}

/* ---- BUTTONS ---- */
.btn{
  padding:8px 16px;
  border:none;
  border-radius:var(--radius2);
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  transition:all 0.15s;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy2)}
.btn-success{background:var(--aqua);color:var(--navy)}
.btn-success:hover{background:var(--aqua2)}
.btn-warning{background:var(--accent3);color:#fff}
.btn-warning:hover{background:#d97706}
.btn-danger{background:var(--accent4);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:var(--bg3);color:var(--navy);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg4)}
.btn-sm{padding:5px 10px;font-size:12px}

/* ---- FORM INPUTS ---- */
.inp{
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:var(--radius2);
  padding:8px 12px;
  color:var(--text);
  font-size:13px;
  width:100%;
  outline:none;
  transition:border-color 0.15s, box-shadow 0.15s;
  font-family:inherit;
}
.inp:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(0,201,167,0.12)}
.inp::placeholder{color:var(--text3)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:80px}
.label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block;font-weight:600}
.field{margin-bottom:10px}

/* ---- TABLES ---- */
.table-wrap{overflow-x:auto;border-radius:var(--radius2);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  background:var(--navy);
  padding:10px 12px;
  text-align:left;
  font-weight:700;
  color:rgba(255,255,255,0.85);
  font-size:12px;
  border-bottom:2px solid var(--aqua);
  white-space:nowrap;
}
td{
  padding:9px 12px;
  border-bottom:1px solid var(--border);
  color:var(--text);
  background:#fff;
}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--aqua-light)}

/* ---- RESULT BOXES ---- */
.result-box{
  background:var(--navy);
  border-radius:var(--radius2);
  padding:16px;
  margin-top:12px;
  border:1px solid rgba(0,201,167,0.25);
  box-shadow:0 2px 8px rgba(13,33,55,0.1);
}
.result-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:13px;
  color:rgba(255,255,255,0.75);
}
.result-row:last-child{border-bottom:none}
.result-val{font-weight:700;color:var(--aqua);font-family:monospace}

/* ---- TABS ---- */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{
  padding:7px 16px;
  border-radius:var(--radius2);
  font-size:13px;
  cursor:pointer;
  background:#fff;
  color:var(--text2);
  border:1.5px solid var(--border);
  transition:all 0.15s;
  font-weight:500;
}
.tab:hover{color:var(--navy);background:var(--aqua-light);border-color:var(--aqua)}
.tab.active{background:var(--navy);color:#fff;font-weight:700;border-color:var(--navy)}

/* ---- ALERT BOXES ---- */
.warn-box{
  background:#fff5f5;
  border:1.5px solid #fecaca;
  border-left:4px solid var(--accent4);
  border-radius:var(--radius2);
  padding:10px 14px;
  margin-top:8px;
  font-size:13px;
  color:#b91c1c;
}
.caution-box{
  background:#fffbeb;
  border:1.5px solid #fde68a;
  border-left:4px solid var(--accent3);
  border-radius:var(--radius2);
  padding:10px 14px;
  margin-top:8px;
  font-size:13px;
  color:#92400e;
}
.info-box{
  background:#eff8ff;
  border:1.5px solid #bae3ff;
  border-left:4px solid #3b9edd;
  border-radius:var(--radius2);
  padding:10px 14px;
  margin-top:8px;
  font-size:13px;
  color:#0d5fa5;
}
.success-box{
  background:var(--aqua-light);
  border:1.5px solid var(--aqua-mid);
  border-left:4px solid var(--aqua);
  border-radius:var(--radius2);
  padding:10px 14px;
  margin-top:8px;
  font-size:13px;
  color:#006b58;
}

/* ---- MISC ---- */
.flex{display:flex;gap:8px;align-items:center}
.flex-end{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.divider{height:1px;background:var(--border);margin:16px 0}
.text-muted{color:var(--text2)}
.text-accent{color:var(--navy)}
.text-success{color:#007d64}
.text-warning{color:#b45309}
.text-danger{color:#b91c1c}
.font-bold{font-weight:700}
.font-mono{font-family:monospace}

/* ---- CHIPS ---- */
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}
.chip-blue{background:#dbeafe;color:#1e40af}
.chip-green{background:var(--aqua-light);color:#065f46}
.chip-red{background:#fee2e2;color:#991b1b}
.chip-amber{background:#fef3c7;color:#92400e}
.chip-purple{background:#ede9fe;color:#5b21b6}

/* ---- QUICK BUTTONS (Dashboard) ---- */
.quick-btn{
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:18px 12px;
  cursor:pointer;
  text-align:center;
  transition:all 0.2s;
  color:var(--navy);
  box-shadow:0 1px 4px rgba(13,33,55,0.06);
}
.quick-btn:hover{
  background:var(--aqua-light);
  border-color:var(--aqua);
  transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(0,201,167,0.15);
}
.quick-btn .qb-icon{font-size:26px;margin-bottom:8px}
.quick-btn .qb-lbl{font-size:12px;color:var(--text2);font-weight:600}

/* ---- MAP ---- */
#map-container{
  height:450px;
  border-radius:var(--radius2);
  overflow:hidden;
  border:1.5px solid var(--border);
}

/* ---- CANVAS ---- */
canvas#plotCanvas{
  background:#f8fbfe;
  border:1.5px solid var(--border);
  border-radius:var(--radius2);
  display:block;
}

/* ---- TOAST NOTIFICATION ---- */
.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  background:var(--navy);
  color:#fff;
  border:1px solid rgba(0,201,167,0.4);
  border-radius:var(--radius);
  padding:12px 18px;
  font-size:13px;
  z-index:9999;
  transform:translateY(80px);
  opacity:0;
  transition:all 0.3s cubic-bezier(.175,.885,.32,1.275);
  max-width:320px;
  box-shadow:0 8px 32px rgba(13,33,55,0.25);
}
.toast.show{transform:translateY(0);opacity:1}

/* ---- FORMULA BOX ---- */
.formula-box{
  background:var(--navy);
  border:1px solid rgba(0,201,167,0.25);
  border-left:4px solid var(--aqua);
  border-radius:var(--radius2);
  padding:10px 14px;
  margin:10px 0;
  font-family:monospace;
  font-size:12px;
  color:rgba(255,255,255,0.75);
}

/* ---- SECTION HEADER ---- */
.section-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}
.section-icon{
  width:36px;
  height:36px;
  border-radius:8px;
  background:var(--aqua-light);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  border:1px solid var(--aqua-mid);
}
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div>
      <div class="logo">GEO<span>NEXA</span></div>
      <div class="logo-sub">Professional Land Surveying Application</div>
    </div>
    <div class="topbar-right">
      <span class="badge" id="offline-badge">● OFFLINE READY</span>
      <span id="projBadge" class="chip chip-green" style="font-size:12px"></span>
    </div>
  </div>

  <!-- NAVIGATION -->
  <div class="nav" id="mainNav"></div>

  <!-- MAIN CONTENT -->
  <div class="main" id="mainContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   GEONEXA - Complete JavaScript
   All modules: Coordinates, Distance, Area, Leveling (HI, Rise&Fall, Least Squares),
   Traverse, Unit Converter, Map, Plot, Export, AI Check, Weather, Team
   Uses localStorage for offline persistence
   ============================================================ */

// ============================================================
// LOCAL STORAGE HELPERS
// ============================================================
const LS = {
  get: (k) => {
    try { return JSON.parse(localStorage.getItem('gsp_' + k) || 'null'); }
    catch(e) { return null; }
  },
  set: (k, v) => localStorage.setItem('gsp_' + k, JSON.stringify(v)),
};

// ============================================================
// APPLICATION STATE
// ============================================================
let state = {
  page: 'dashboard',
  levPage: 'hi',       // Active leveling tab: 'hi' | 'rf' | 'ls'
  distMode: 'manual',  // Distance calculator mode
  currentProject: LS.get('currentProject') || 'Field Survey 2024',

  // Saved survey points
  points: LS.get('points') || [],

  // HI Method leveling rows
  hiRows: LS.get('hiRows') || [],

  // Rise and Fall Method rows
  rfRows: LS.get('rfRows') || [],

  // Least Squares leveling observations
  lsRows: LS.get('lsRows') || [],

  // Traverse stations
  traverseRows: LS.get('traverseRows') || [],

  // Area polygon points
  areaPoints: LS.get('areaPoints') || [],

  // Team data
  teamMembers: LS.get('teamMembers') || [
    {name:'Ahmed Ali',   role:'Admin',    status:'online'},
    {name:'Sara Khan',   role:'Surveyor', status:'offline'},
    {name:'Bilal Raza',  role:'Viewer',   status:'online'},
  ],
  teamNotes: LS.get('teamNotes') || '',
  teamTasks: LS.get('teamTasks') || [
    {text:'Collect traverse points',        done:true},
    {text:'Measure RL at bench mark',       done:false},
    {text:'Submit leveling report',         done:false},
    {text:'Verify area polygon closure',    done:false},
  ],
};

// Save all state to localStorage
function saveState() {
  LS.set('currentProject', state.currentProject);
  LS.set('points',         state.points);
  LS.set('hiRows',         state.hiRows);
  LS.set('rfRows',         state.rfRows);
  LS.set('lsRows',         state.lsRows);
  LS.set('traverseRows',   state.traverseRows);
  LS.set('areaPoints',     state.areaPoints);
  LS.set('teamMembers',    state.teamMembers);
  LS.set('teamNotes',      state.teamNotes);
  LS.set('teamTasks',      state.teamTasks);
}

// ============================================================
// TOAST NOTIFICATIONS
// ============================================================
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  const colors = {
    success: 'var(--accent2)',
    error:   'var(--accent4)',
    warn:    'var(--accent3)',
    info:    'var(--accent)',
  };
  el.style.borderColor = colors[type] || colors.info;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

// ============================================================
// NAVIGATION PAGES
// ============================================================
const PAGES = [
  {id:'dashboard',   label:'📊 Dashboard'},
  {id:'coordinates', label:'📍 Coordinates'},
  {id:'distance',    label:'📏 Distance'},
  {id:'area',        label:'🗺️ Area'},
  {id:'leveling',    label:'📐 Leveling/RL'},
  {id:'traverse',    label:'🔄 Traverse'},
  {id:'converter',   label:'⚖️ Units'},
  {id:'map',         label:'🗾 Map View'},
  {id:'plot',        label:'✏️ Plot'},
  {id:'export',      label:'📤 Export'},
  {id:'aicheck',     label:'🤖 AI Check'},
  {id:'weather',     label:'🌤️ Weather'},
  {id:'team',        label:'👥 Team'},
  {id:'contour',     label:'🏔️ Contour'},
];

function renderNav() {
  const nav = document.getElementById('mainNav');
  nav.innerHTML = PAGES.map(p =>
    `<button class="nav-btn ${state.page === p.id ? 'active' : ''}"
      onclick="navigate('${p.id}')">${p.label}</button>`
  ).join('');

  // Update project badge
  const pb = document.getElementById('projBadge');
  if(pb) pb.textContent = '● ' + state.currentProject;
}

function navigate(page) {
  state.page = page;
  renderNav();
  renderPage();
  window.scrollTo(0, 0);
}

// Main page router
function renderPage() {
  const map = {
    dashboard:   renderDashboard,
    coordinates: renderCoordinates,
    distance:    renderDistance,
    area:        renderArea,
    leveling:    renderLeveling,
    traverse:    renderTraverse,
    converter:   renderConverter,
    map:         renderMap,
    plot:        renderPlot,
    export:      renderExport,
    aicheck:     renderAICheck,
    weather:     renderWeather,
    team:        renderTeam,
    contour:     renderContour,
  };
  document.getElementById('mainContent').innerHTML = '';
  (map[state.page] || renderDashboard)();
}

// ============================================================
// 1. DASHBOARD
// ============================================================
function renderDashboard() {
  const c = document.getElementById('mainContent');
  const lastPt = state.points.length
    ? state.points[state.points.length - 1].name
    : 'None';

  c.innerHTML = `
  <!-- HERO -->
  <div class="card" style="background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);border-color:var(--aqua)">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-size:42px">🛰️</div>
      <div>
        <div style="font-size:22px;font-weight:700;color:var(--aqua)">GEONEXA</div>
        <div style="font-size:13px;color:var(--text2);margin-top:2px">Professional Geological Engineering & Land Surveying Application</div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
          <span class="chip chip-green">✅ Offline Ready</span>
          <span class="chip chip-blue">📍 GPS Enabled</span>
          <span class="chip chip-amber">📐 Least Squares</span>
          <span class="chip chip-purple">🗾 OpenStreetMap</span>
        </div>
      </div>
      <div style="margin-left:auto;text-align:right">
        <div style="font-size:11px;color:var(--text3)">Current Project</div>
        <input class="inp" id="projName" value="${state.currentProject}"
          style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.1);margin-top:4px;width:200px"
          oninput="state.currentProject=this.value;saveState();renderNav()">
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="grid4">
    <div class="stat-card">
      <div class="stat-val">${state.points.length}</div>
      <div class="stat-lbl">📍 Survey Points</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--accent2)">${state.hiRows.length + state.rfRows.length + state.lsRows.length}</div>
      <div class="stat-lbl">📐 RL Records</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--accent3)">${state.traverseRows.length}</div>
      <div class="stat-lbl">🔄 Traverse Stations</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--accent4);font-size:18px">${lastPt}</div>
      <div class="stat-lbl">Last Point Saved</div>
    </div>
  </div>

  <!-- QUICK ACCESS -->
  <div class="card">
    <div class="card-title">⚡ Quick Access</div>
    <div class="grid4">
      ${[
        ['coordinates','📍','Coordinate System'],
        ['distance',   '📏','Distance Calc'],
        ['area',       '🗺️','Area Calculator'],
        ['leveling',   '📐','RL / Leveling'],
        ['traverse',   '🔄','Traverse Survey'],
        ['map',        '🗾','Map View'],
        ['aicheck',    '🤖','AI Survey Check'],
        ['export',     '📤','Export Data'],
      ].map(([id,ic,lb]) => `
      <div class="quick-btn" onclick="navigate('${id}')">
        <div class="qb-icon">${ic}</div>
        <div class="qb-lbl">${lb}</div>
      </div>`).join('')}
    </div>
  </div>

  <!-- RECENT POINTS + PROJECT SUMMARY -->
  <div class="grid2">
    <div class="card">
      <div class="card-title">📍 Recent Survey Points</div>

// Get live GPS from browser
function getGPS() {
  if (!navigator.geolocation) { toast('GPS not supported on this device', 'error'); return; }
  toast('Acquiring GPS location...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('ptLat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('ptLon').value = pos.coords.longitude.toFixed(6);
      if (pos.coords.altitude) {
        document.getElementById('ptRL').value = pos.coords.altitude.toFixed(2);
      }
      toast('GPS location acquired!', 'success');
    },
    err => toast('GPS error: ' + err.message, 'error')
  );
}

// Import CSV / TXT file
function importCSVFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l => l.trim());
    let added = 0, skipped = 0;
    lines.forEach((line, i) => {
      // Skip header row
      if (i === 0 && isNaN(parseFloat(line.split(',')[1]))) return;
      const parts = line.split(',').map(s => s.trim());
      if (parts.length >= 2) {
        const name = parts[0] || ('IMP' + (i + 1));
        if (!state.points.find(p => p.name === name)) {
          state.points.push({
            name,
            easting:  parts[1] || '',
            northing: parts[2] || '',
            rl:       parts[3] || '',
            desc:     parts[4] || '',
            lat: '', lon: '',
          });
          added++;
        } else {
          skipped++;
        }
      }
    });
    saveState();
    toast(`Imported ${added} points (${skipped} duplicates skipped)`, 'success');
    renderCoordinates();
  };
  reader.readAsText(file);
  input.value = ''; // Reset so same file can be re-imported
}

function renderDistance() {

      </div>
      <div class="field">

      </div>
    </div>`}

    </div>
    <div id="distResult"></div>
  </div>`;
}

function calcDistance() {
  let e1, n1, rl1, e2, n2, rl2;

  if (state.distMode === 'saved') {
    const n1v = document.getElementById('dP1').value;
    const n2v = document.getElementById('dP2').value;
    const p1 = state.points.find(p => p.name === n1v);
    const p2 = state.points.find(p => p.name === n2v);
    if (!p1 || !p2) { toast('Points not found in saved list', 'error'); return; }
    e1=+p1.easting; n1=+p1.northing; rl1=+p1.rl;
    e2=+p2.easting; n2=+p2.northing; rl2=+p2.rl;
  } else {
    e1=+document.getElementById('dE1').value;
    n1=+document.getElementById('dN1').value;
    rl1=+document.getElementById('dRL1').value;
    e2=+document.getElementById('dE2').value;
    n2=+document.getElementById('dN2').value;
    rl2=+document.getElementById('dRL2').value;
  }

  // Formulas
  const hd  = Math.sqrt((e2-e1)**2 + (n2-n1)**2);
  const rld = rl2 - rl1;
  const sd  = Math.sqrt(hd**2 + rld**2);
  const bearing = Math.atan2(e2-e1, n2-n1) * 180 / Math.PI;
  const bearingNorm = (bearing + 360) % 360;

  document.getElementById('distResult').innerHTML = `
    <div class="result-box">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text2)">📐 Calculation Results</div>
      <div class="result-row">
        <span>Horizontal Distance (HD)</span>
        <span class="result-val">${hd.toFixed(4)} m &nbsp;/&nbsp; ${(hd*3.28084).toFixed(4)} ft</span>
      </div>
      <div class="result-row">
        <span>RL Difference (ΔRL)</span>
        <span class="result-val ${rld>=0?'text-success':'text-danger'}">${rld>=0?'+':''}${rld.toFixed(4)} m</span>
      </div>
      <div class="result-row">
        <span>Slope Distance (SD)</span>
        <span class="result-val">${sd.toFixed(4)} m &nbsp;/&nbsp; ${(sd*3.28084).toFixed(4)} ft</span>
      </div>
      <div class="result-row">
        <span>Bearing (from North)</span>
        <span class="result-val">${bearingNorm.toFixed(2)}°</span>
      </div>
      <div class="result-row">
        <span>ΔEasting (E₂−E₁)</span>
        <span class="result-val">${(e2-e1).toFixed(4)} m</span>
      </div>
      <div class="result-row">
        <span>ΔNorthing (N₂−N₁)</span>
        <span class="result-val">${(n2-n1).toFixed(4)} m</span>
      </div>
    </div>`;
}

function renderAreaRows() {
  if (!state.areaPoints.length) {
    return '<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:16px">No points in polygon</td></tr>';
  }
  return state.areaPoints.map((p, i) => `
    <tr>
      <td style="color:var(--text3)">${i + 1}</td>
      <td class="font-mono">${p.e}</td>
      <td class="font-mono">${p.n}</td>
      <td>
        <button class="btn btn-ghost btn-sm" style="color:var(--accent4)"
          onclick="state.areaPoints.splice(${i},1);saveState();renderArea()">🗑</button>
      </td>
    </tr>`).join('');
}

function areaLoadFromSaved() {
  const n = document.getElementById('aPtSel').value;
  if (!n) return;
  const p = state.points.find(x => x.name === n);
  if (p) {
    document.getElementById('aE').value = p.easting;
    document.getElementById('aN').value = p.northing;
  }
}

function areaAddPoint() {
  const e = parseFloat(document.getElementById('aE').value);
  const n = parseFloat(document.getElementById('aN').value);
  if (isNaN(e) || isNaN(n)) { toast('Enter valid Easting and Northing', 'error'); return; }
  state.areaPoints.push({e, n});
  saveState();
  document.getElementById('areaPtsBody').innerHTML = renderAreaRows();
  toast('Point added to polygon', 'success');
}

function calcArea() {
  const pts = state.areaPoints;
  if (pts.length < 3) { toast('Need at least 3 points for area calculation', 'error'); return; }

  // Shoelace formula
  let sum = 0;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    sum += pts[i].e * pts[j].n - pts[j].e * pts[i].n;
  }
  const sqm  = Math.abs(sum / 2);
  const sqft = sqm * 10.76391;
  const acre = sqm / 4046.8564224;
  const hect = sqm / 10000;
  const kana = sqm / 505.857;
  const marl = sqm / 25.2929;

  document.getElementById('areaResultDiv').innerHTML = `
    <div class="result-box" style="margin-top:0">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text2)">🗺️ Area Results</div>

        <span class="result-val">${sqm.toFixed(3)}</span></div>
      <div class="result-row"><span>Square Feet (ft²)</span>
        <span class="result-val">${sqft.toFixed(3)}</span></div>
      <div class="result-row"><span>Acres</span>
        <span class="result-val">${acre.toFixed(5)}</span></div>
      <div class="result-row"><span>Hectares (ha)</span>
        <span class="result-val">${hect.toFixed(5)}</span></div>
      <div class="result-row"><span>Kanals</span>
        <span class="result-val">${kana.toFixed(3)}</span></div>
      <div class="result-row"><span>Marlas</span>
        <span class="result-val">${marl.toFixed(3)}</span></div>
      <div class="result-row"><span>Polygon Points</span>
        <span class="result-val">${pts.length}</span></div>
    </div>`;
}

function computeHITable() {
  const rows = state.hiRows;
  if (!rows.length) return '<div class="text-muted" style="padding:8px">No observations. Add rows above.</div>';

  // Forward computation using HI method
  let results = [];
  let curRL = rows[0].rl ? +rows[0].rl : 100.0;
  let curHI = rows[0].bs ? curRL + (+rows[0].bs) : curRL;
  results.push({ ...rows[0], calcRL: curRL.toFixed(4), calcHI: curHI.toFixed(4) });

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    // Update RL from previous HI
    if (r.is && r.is !== '')       curRL = curHI - (+r.is);
    else if (r.fs && r.fs !== '')  curRL = curHI - (+r.fs);
    // Update HI if BS present
    if (r.bs && r.bs !== '')       curHI = curRL + (+r.bs);
    results.push({ ...r, calcRL: curRL.toFixed(4), calcHI: curHI.toFixed(4) });
  }

  // Arithmetic check
  const sumBS = rows.reduce((a, r) => a + (r.bs ? +r.bs : 0), 0);
  const sumFS = rows.reduce((a, r) => a + (r.fs ? +r.fs : 0), 0);
  const firstRL = +rows[0].rl || 100;
  const lastRL = +results[results.length - 1].calcRL;

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Station</th><th>BS</th><th>IS</th><th>FS</th>
          <th>HI (m)</th><th>RL (m)</th><th>Remarks</th></tr>
        </thead>
        <tbody>
          ${results.map(r => `

            <td><b>${r.st}</b></td>

            <td class="font-mono">${r.is || '-'}</td>
            <td class="font-mono text-warning">${r.fs || '-'}</td>
            <td class="font-mono text-accent">${r.calcHI}</td>
            <td class="font-mono text-success font-bold">${r.calcRL}</td>

      <div class="result-row"><span>ΣBS</span><span class="result-val">${sumBS.toFixed(4)}</span></div>
      <div class="result-row"><span>ΣFS</span><span class="result-val">${sumFS.toFixed(4)}</span></div>

// ---- C. LEAST SQUARES METHOD ----
/*
   LEAST SQUARES WEIGHTED LEVELING ADJUSTMENT
   ============================================
   Theory:
     In leveling networks, multiple height difference observations (Δh)
     are made between stations. When there is redundancy (more observations
     than unknowns), the system is over-determined and requires adjustment.

   Simplified Weighted Least Squares:
     Step 1: Assign weights w_i
       - If distance-based: w_i = 1 / d_i  (shorter route = higher weight)
       - If manual: w_i = user input value

     Step 2: Compute approximate RLs
       - Forward traversal from known starting RL

     Step 3: Compute misclosure (if closing BM is given)
       - Misclosure (e) = Σ(observed Δh) − (RL_closing − RL_starting)

     Step 4: Distribute corrections proportional to route distance
       - Correction_i = −e × (d_i / Σd)
       - (In full LS matrix form: corrections minimize Σw_i × v_i²)

     Step 5: Adjusted Δh_i = observed_Δh_i + correction_i
     Step 6: Adjusted RLs recomputed from adjusted Δh values
     Step 7: Residuals v_i = correction_i (for simplified proportional method)
*/

  d.innerHTML = `

function runLeastSquares() {
  /*
     LEAST SQUARES WEIGHTED LEVELING — FULL CALCULATION
     ====================================================
     For a leveling network with n observations:

     1. WEIGHTS:
        w_i = 1/d_i  if distance-based (d in km)
        w_i = user value  if manual

     2. APPROXIMATE RLs (forward computation):
        RL(to_i) = RL(from_i) + Δh_i

     3. MISCLOSURE (if closing BM given):
        Misclosure e = Σ(Δh_i) − [RL_close − RL_start]

     4. CORRECTIONS (proportional to distance = simplified WLS):
        c_i = −e × (d_i / Σd_i)
        This is equivalent to minimising Σ(c_i²/d_i) = Σ(v_i² × w_i)
        which is the Weighted Least Squares criterion.

     5. ADJUSTED VALUES:
        Δh_adj_i = Δh_i + c_i
        RL_adj computed forward from adjusted Δh

     6. RESIDUALS:
        v_i = c_i  (correction applied = residual in simplified method)
  */

  const rows = state.lsRows;
  if (!rows.length) { toast('No observations to adjust', 'error'); return; }

  // Step 1: Compute weights
  const weights = rows.map(r =>
    r.wtype === 'distance' ? 1 / r.dist : r.dist
  );
  const sumWeights = weights.reduce((a, b) => a + b, 0);
  const sumDist    = rows.reduce((a, r) => a + r.dist, 0);

  // Step 2: Starting RL
  const startRL = rows[0].krl !== '' ? +rows[0].krl : 100.0;

  // Step 3: Approximate RLs (forward traversal)
  const approxRL = {};
  approxRL[rows[0].from] = startRL;
  rows.forEach(r => {
    const fromRL = approxRL[r.from] !== undefined ? approxRL[r.from] : startRL;
    approxRL[r.to] = fromRL + r.dh;
  });

  // Step 4: Misclosure
  const sumObsDh = rows.reduce((a, r) => a + r.dh, 0);
  const closingRow = rows.find(r => r.clrl !== '');
  const hasClosing = !!(closingRow && closingRow.clrl !== '');
  const knownDiff  = hasClosing ? (closingRow.clrl - startRL) : null;
  const misclosure = hasClosing ? (sumObsDh - knownDiff) : 0;

  // Step 5: Corrections — proportional to distance (simplified WLS)
  // c_i = −e × (d_i / Σd_i)
  const corrections = rows.map(r =>
    hasClosing ? (-misclosure * r.dist / sumDist) : 0
  );
  const sumCorr = corrections.reduce((a, b) => a + b, 0);

  // Step 6: Adjusted Δh and RLs
  const adjDh  = rows.map((r, i) => r.dh + corrections[i]);
  const adjRLs = [];
  let adjCurRL = startRL;
  adjDh.forEach(dh => {
    adjCurRL += dh;
    adjRLs.push(adjCurRL);
  });

  // Final adjusted closing RL
  const finalAdjRL = adjRLs[adjRLs.length - 1];

  // Build result HTML
  const resDiv = document.getElementById('lsAdjResult');
  if (!resDiv) return;

  const isBigMisclosure = hasClosing && Math.abs(misclosure) > 0.050;

  resDiv.innerHTML = `
    <!-- ARITHMETIC CHECK PANEL -->
    ${hasClosing ? `
    <div class="${isBigMisclosure ? 'warn-box' : 'success-box'}" style="margin-bottom:14px">
      <b>📋 Arithmetic Check</b><br>

        <div>
          <div style="font-size:11px;opacity:0.7">Total Observed Δh</div>
          <div class="font-mono font-bold">${sumObsDh.toFixed(4)} m</div>
        </div>
        <div>
          <div style="font-size:11px;opacity:0.7">Known Δh (BM₂−BM₁)</div>
          <div class="font-mono font-bold">${knownDiff.toFixed(4)} m</div>
        </div>
        <div>
          <div style="font-size:11px;opacity:0.7">Misclosure (e)</div>
          <div class="font-mono font-bold ${isBigMisclosure?'text-danger':''}">${misclosure.toFixed(4)} m</div>
        </div>
        <div>
          <div style="font-size:11px;opacity:0.7">Total Correction</div>
          <div class="font-mono font-bold">${sumCorr.toFixed(4)} m</div>
        </div>

          <div class="font-mono font-bold">${finalAdjRL.toFixed(4)} m</div>

        </div>

    <!-- ADJUSTMENT RESULTS TABLE -->

function renderTraverse() {
  const c = document.getElementById('mainContent');
  c.innerHTML = `

    <div class="formula-box">

      Closing Error = √(ΣDep² + ΣLat²) &nbsp;|&nbsp;
      Relative Precision = Total Distance / Closing Error
    </div>
    <div class="grid3" style="margin:12px 0 10px">
      <div class="field"><label class="label">Station Name</label>
        <input class="inp" id="trSt" placeholder="A, B, C..."></div>

        <input class="inp" id="trDist" type="number" step="any" min="0" placeholder="0.000"></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="label">Starting Easting (for first row)</label>
        <input class="inp" id="trSE" type="number" step="any" placeholder="1000.000"></div>

        onclick="if(confirm('Clear traverse?')){state.traverseRows=[];saveState();renderTraverse()}">
        🗑 Clear All
      </button>
      <button class="btn btn-success" onclick="addTraverseRow()">+ Add Station</button>
      <button class="btn btn-primary" onclick="calcTraverse()">🔢 Calculate Traverse</button>
    </div>
  </div>

    <div class="card-title">Traverse Table
      <span class="chip chip-blue">${state.traverseRows.length} stations</span>
    </div>
    <div id="traverseTableDiv">${buildTraverseTable()}</div>
  </div>`;
}

function addTraverseRow() {
  const st = document.getElementById('trSt').value.trim();
  if (!st) { toast('Station name required', 'error'); return; }
  const br = parseFloat(document.getElementById('trBr').value);
  const dist = parseFloat(document.getElementById('trDist').value);
  if (isNaN(br)) { toast('Bearing required', 'error'); return; }
  if (isNaN(dist) || dist <= 0) { toast('Valid distance required', 'error'); return; }
  state.traverseRows.push({
    st, bearing: br, dist,
    se: document.getElementById('trSE').value || '',
    sn: document.getElementById('trSN').value || '',
  });
  saveState();
  renderTraverse();
  toast(`Station "${st}" added`, 'success');
}

function buildTraverseTable() {
  const rows = state.traverseRows;
  if (!rows.length) return '<div class="text-muted" style="padding:8px">No stations added. Add stations above.</div>';

  let E = rows[0].se ? +rows[0].se : 1000;
  let N = rows[0].sn ? +rows[0].sn : 1000;
  const startE = E, startN = N;
  const results = [];

  rows.forEach(r => {
    const brRad  = r.bearing * Math.PI / 180;
    const lat    = r.dist * Math.cos(brRad);
    const dep    = r.dist * Math.sin(brRad);
    E += dep; N += lat;
    results.push({ ...r, lat: lat.toFixed(4), dep: dep.toFixed(4), E: E.toFixed(4), N: N.toFixed(4) });
  });

  const closingDE = E - startE;
  const closingDN = N - startN;
  const closingErr = Math.sqrt(closingDE**2 + closingDN**2);
  const totalDist  = rows.reduce((a, r) => a + r.dist, 0);
  const relPrec    = closingErr > 0 ? Math.round(totalDist / closingErr) : '∞';

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Station</th><th>Bearing (°)</th><th>Distance (m)</th>
            <th>Latitude (+N/−S)</th><th>Departure (+E/−W)</th>
            <th>Easting</th><th>Northing</th>
          </tr>
        </thead>
        <tbody>
          ${results.map(r => `
          <tr>
            <td><b>${r.st}</b></td>
            <td class="font-mono">${r.bearing.toFixed(2)}°</td>
            <td class="font-mono">${r.dist.toFixed(3)}</td>
            <td class="font-mono ${+r.lat>=0?'text-success':'text-danger'}">${(+r.lat>=0?'+':'')+r.lat}</td>
            <td class="font-mono ${+r.dep>=0?'text-accent':'text-warning'}">${(+r.dep>=0?'+':'')+r.dep}</td>
            <td class="font-mono">${r.E}</td>
            <td class="font-mono">${r.N}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="result-box" style="margin-top:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text2)">Traverse Closure Analysis</div>
      <div class="result-row"><span>Total Distance</span>
        <span class="result-val">${totalDist.toFixed(3)} m</span></div>
      <div class="result-row"><span>Closing Error ΔE</span>
        <span class="result-val">${closingDE.toFixed(4)} m</span></div>
      <div class="result-row"><span>Closing Error ΔN</span>
        <span class="result-val">${closingDN.toFixed(4)} m</span></div>
      <div class="result-row"><span>Total Closing Error</span>
        <span class="result-val ${closingErr>0.1?'text-danger':'text-success'}">${closingErr.toFixed(4)} m</span></div>
      <div class="result-row"><span>Relative Precision</span>
        <span class="result-val">1 : ${relPrec}</span></div>
    </div>
    <div class="flex-end">
      <button class="btn btn-ghost btn-sm" onclick="exportTraverseCSV()">📥 Export CSV</button>
    </div>`;
}

function calcTraverse() {
  document.getElementById('traverseTableDiv').innerHTML = buildTraverseTable();
  toast('Traverse calculated!', 'success');
}

    </div>

function initLeafletMap() {
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }

  const gpsPoints = state.points.filter(p => p.lat && p.lon);
  // Default center: Pakistan
  const center = gpsPoints.length
    ? [+gpsPoints[0].lat, +gpsPoints[0].lon]
    : [30.3753, 69.3451];
  const zoom = gpsPoints.length > 0 ? 15 : 5;

  leafletMap = L.map('map-container').setView(center, zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
  }).addTo(leafletMap);

  // Add markers
  gpsPoints.forEach(p => {
    L.marker([+p.lat, +p.lon])
      .addTo(leafletMap)
      .bindPopup(`
        <b style="font-size:14px">${p.name}</b><br>
        Lat: ${p.lat}<br>Lon: ${p.lon}<br>
        RL: ${p.rl || 'N/A'} m<br>
        ${p.desc ? '<i>' + p.desc + '</i>' : ''}
      `);
  });

  // Connect points with polyline
  if (gpsPoints.length > 1) {
    const latLngs = gpsPoints.map(p => [+p.lat, +p.lon]);
    L.polyline(latLngs, { color: '#3b82f6', weight: 2, dashArray: '5,5' }).addTo(leafletMap);
  }

  // Show polygon if 3+ points
  if (gpsPoints.length > 2) {
    const latLngs = gpsPoints.map(p => [+p.lat, +p.lon]);
    L.polygon(latLngs, {
      color: '#10b981', fillColor: '#10b981', fillOpacity: 0.08, weight: 1.5,
    }).addTo(leafletMap);
  }
}

function centerMapOnPoints() {
  if (!leafletMap) return;
  const pts = state.points.filter(p => p.lat && p.lon);
  if (!pts.length) { toast('No GPS points to fit', 'warn'); return; }
  const bounds = L.latLngBounds(pts.map(p => [+p.lat, +p.lon]));
  leafletMap.fitBounds(bounds, { padding: [40, 40] });
}

function clearPlotCanvas() {
  const canvas = document.getElementById('plotCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function drawSurveyPlot() {
  const canvas = document.getElementById('plotCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pts = state.points.filter(p => p.easting !== '' && p.northing !== '');

  if (!pts.length) {
    ctx.fillStyle = '#64748b';
    ctx.font = '15px sans-serif';
    ctx.fillText('No points with Easting/Northing to plot.', 30, 220);
    ctx.font = '12px sans-serif';
    ctx.fillText('Add points with Easting and Northing values in the Coordinates section.', 30, 248);
    return;
  }

  const pad = 60;
  const W = canvas.width  - pad * 2;
  const H = canvas.height - pad * 2;

  const Es = pts.map(p => +p.easting);
  const Ns = pts.map(p => +p.northing);
  const minE = Math.min(...Es), maxE = Math.max(...Es);
  const minN = Math.min(...Ns), maxN = Math.max(...Ns);
  const rangeE = maxE - minE || 1;
  const rangeN = maxN - minN || 1;

  const toX = e => pad + ((e - minE) / rangeE) * W;
  const toY = n => pad + H - ((n - minN) / rangeN) * H;

  // Draw grid
  ctx.strokeStyle = '#dde4ed'; ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    ctx.beginPath(); ctx.moveTo(pad, pad + i * H / 5); ctx.lineTo(pad + W, pad + i * H / 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad + i * W / 5, pad); ctx.lineTo(pad + i * W / 5, pad + H); ctx.stroke();
  }

  // Axes labels
  ctx.fillStyle = '#64748b'; ctx.font = '11px monospace';
  for (let i = 0; i <= 5; i++) {
    const e = (minE + i * rangeE / 5).toFixed(1);
    const n = (minN + (5 - i) * rangeN / 5).toFixed(1);
    ctx.fillText(e, pad + i * W / 5 - 15, pad + H + 18);
    ctx.fillText(n, 2, pad + i * H / 5 + 4);
  }

  // Axis titles
  ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif';
  ctx.fillText('Easting (m)', pad + W / 2 - 30, canvas.height - 5);
  ctx.save(); ctx.translate(12, pad + H / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('Northing (m)', -36, 0); ctx.restore();

  // Draw connecting lines
  if (pts.length > 1) {
    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(toX(+pts[0].easting), toY(+pts[0].northing));
    pts.slice(1).forEach(p => ctx.lineTo(toX(+p.easting), toY(+p.northing)));
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Draw area polygon
  if (state.areaPoints.length > 2) {
    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.fillStyle = 'rgba(16,185,129,0.05)';
    ctx.beginPath();
    ctx.moveTo(toX(state.areaPoints[0].e), toY(state.areaPoints[0].n));
    state.areaPoints.forEach(p => ctx.lineTo(toX(p.e), toY(p.n)));
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  }

  // Draw points
  pts.forEach((p, i) => {
    const x = toX(+p.easting), y = toY(+p.northing);
    // Outer glow
    ctx.fillStyle = 'rgba(16,185,129,0.2)';
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
    // Main point
    ctx.fillStyle = '#10b981';
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#065f46'; ctx.lineWidth = 1.5; ctx.stroke();
    // Label
    ctx.fillStyle = '#0d2137'; ctx.font = 'bold 11px sans-serif';
    ctx.fillText(p.name, x + 8, y - 6);
    if (p.rl) {
      ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
      ctx.fillText('RL:' + p.rl, x + 8, y + 8);
    }
  });
}

// ---- Download helper ----
function downloadFile(filename, mimeType, content) {
  const blob = new Blob([content], { type: mimeType });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function exportCoordCSV() {
  if (!state.points.length) { toast('No coordinates to export', 'error'); return; }
  let csv = 'Point Name,Latitude,Longitude,Easting,Northing,RL,Description\n';
  state.points.forEach(p =>
    csv += `${p.name},${p.lat},${p.lon},${p.easting},${p.northing},${p.rl},"${p.desc}"\n`
  );
  downloadFile('GEONEXA_Coordinates.csv', 'text/csv', csv);
  toast('Coordinates exported!', 'success');
}

function runAIChecks() {
  const warnings = [];

  // ---- Coordinate checks ----
  state.points.forEach(p => {
    if (!p.name) warnings.push({type:'error', msg:'🔴 A point is missing a name/ID'});
    if (!p.easting && !p.lat) warnings.push({type:'warn', msg:`🟡 Point "${p.name}" has no coordinates (Easting or Latitude)`});
    if (!p.rl) warnings.push({type:'info', msg:`🔵 Point "${p.name}" has no RL/Elevation value`});
    if (p.lat && (Math.abs(+p.lat) > 90)) warnings.push({type:'error', msg:`🔴 Point "${p.name}" has invalid Latitude (>90°)`});
    if (p.lon && (Math.abs(+p.lon) > 180)) warnings.push({type:'error', msg:`🔴 Point "${p.name}" has invalid Longitude (>180°)`});
  });

  // ---- Duplicate point names ----
  const ptNames = state.points.map(p => p.name);
  const dupes   = ptNames.filter((n, i) => n && ptNames.indexOf(n) !== i);
  [...new Set(dupes)].forEach(d =>
    warnings.push({type:'error', msg:`🔴 Duplicate point name: "${d}"`})
  );

  // ---- Unrealistic distance jumps ----
  if (state.points.length > 1) {
    for (let i = 1; i < state.points.length; i++) {
      const a = state.points[i-1], b = state.points[i];
      if (a.easting && b.easting && a.northing && b.northing) {
        const dist = Math.sqrt((+b.easting-+a.easting)**2 + (+b.northing-+a.northing)**2);
        if (dist > 50000) warnings.push({type:'warn', msg:`🟡 Large distance jump (${dist.toFixed(0)} m) between "${a.name}" and "${b.name}" — check coordinates`});
      }
    }
  }

  // ---- HI leveling checks ----
  state.hiRows.forEach(r => {
    if (!r.st) warnings.push({type:'error', msg:'🔴 HI Method: row missing station name'});
    if (!r.bs && !r.is && !r.fs) warnings.push({type:'warn', msg:`🟡 HI Method station "${r.st}": no staff readings (BS/IS/FS) entered`});
  });

  // ---- LS leveling checks ----
  state.lsRows.forEach((r, i) => {
    if (!r.id)     warnings.push({type:'error', msg:`🔴 LS Observation #${i+1} missing ID`});
    if (!r.from)   warnings.push({type:'error', msg:`🔴 LS Obs "${r.id}": missing From Station`});
    if (!r.to)     warnings.push({type:'error', msg:`🔴 LS Obs "${r.id}": missing To Station`});
    if (r.from === r.to && r.from) warnings.push({type:'error', msg:`🔴 LS Obs "${r.id}": From and To stations are the same`});
    if (r.dist <= 0) warnings.push({type:'error', msg:`🔴 LS Obs "${r.id}": distance/weight must be positive (got ${r.dist})`});
    if (i === 0 && r.krl === '') warnings.push({type:'warn', msg:'🟡 LS Leveling: No known RL for starting benchmark — assumed 100.000 m'});
  });

  // ---- LS misclosure check ----
  if (state.lsRows.length > 0) {
    const clRow = state.lsRows.find(r => r.clrl !== '');
    if (clRow) {
      const startRL = state.lsRows[0].krl !== '' ? +state.lsRows[0].krl : 100;
      const sumDh = state.lsRows.reduce((a, r) => a + r.dh, 0);
      const misc  = sumDh - (+clRow.clrl - startRL);
      if (Math.abs(misc) > 0.050) warnings.push({type:'error', msg:`🔴 LS Leveling: Large misclosure = ${misc.toFixed(4)} m (exceeds 50mm tolerance)`});
      else if (Math.abs(misc) > 0.010) warnings.push({type:'warn', msg:`🟡 LS Leveling: Misclosure = ${misc.toFixed(4)} m (within 50mm but check fieldwork)`});
    } else {
      warnings.push({type:'info', msg:'🔵 LS Leveling: No closing benchmark RL provided — misclosure cannot be verified'});
    }
  }

  // ---- Traverse checks ----
  state.traverseRows.forEach(r => {
    if (!r.st) warnings.push({type:'error', msg:'🔴 Traverse: station missing name'});
    if (!r.dist || r.dist <= 0) warnings.push({type:'warn', msg:`🟡 Traverse station "${r.st}": distance is zero or negative`});
    if (r.bearing < 0 || r.bearing > 360) warnings.push({type:'error', msg:`🔴 Traverse station "${r.st}": bearing must be 0–360° (got ${r.bearing})`});
  });

  // ---- Area polygon check ----
  if (state.areaPoints.length > 0 && state.areaPoints.length < 3) {
    warnings.push({type:'warn', msg:`🟡 Area Calculator: polygon has only ${state.areaPoints.length} point(s) — need at least 3 for area calculation`});
  }

  return warnings;
}

function addTeamMember() {
  const name = document.getElementById('newMemberName').value.trim();
  const role = document.getElementById('newMemberRole').value;
  if (!name) { toast('Enter member name', 'error'); return; }
  state.teamMembers.push({ name, role, status: 'offline' });
  saveState(); renderTeam();
  toast(`${name} added to team`, 'success');
}

function addTeamTask() {
  const text = document.getElementById('newTaskInp').value.trim();
  if (!text) return;
  state.teamTasks.push({ text, done: false });
  saveState(); renderTeam();
}

// ============================================================
// 14. CONTOUR MAPPING (Basic Visualization)
// ============================================================
function renderContour() {
  const c = document.getElementById('mainContent');
  const elevPts = state.points.filter(p => p.easting && p.northing && p.rl);

  c.innerHTML = `
  <div class="card">
    <div class="card-title">🏔️ Contour / Elevation Visualization</div>
    <div class="info-box" style="margin-bottom:14px">
      Basic elevation color map using saved survey points with Easting, Northing, and RL values.
      Full contour line generation requires triangulation algorithms (TIN/Delaunay) — 
      add D3.js contour library for full implementation.
    </div>

    <div style="font-size:13px;margin-bottom:12px;color:var(--text2)">
      Points with elevation data: <b class="text-success">${elevPts.length}</b>
    </div>

    <canvas id="contourCanvas" width="760" height="440"
      style="width:100%;max-width:760px;height:auto;border:1px solid var(--border);border-radius:var(--radius2)">
    </canvas>

    <div class="result-box" style="margin-top:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">Elevation Statistics</div>
      ${elevPts.length >= 2 ? `
      <div class="result-row"><span>Min Elevation</span><span class="result-val">${Math.min(...elevPts.map(p=>+p.rl)).toFixed(3)} m</span></div>
      <div class="result-row"><span>Max Elevation</span><span class="result-val">${Math.max(...elevPts.map(p=>+p.rl)).toFixed(3)} m</span></div>
      <div class="result-row"><span>Range</span><span class="result-val">${(Math.max(...elevPts.map(p=>+p.rl))-Math.min(...elevPts.map(p=>+p.rl))).toFixed(3)} m</span></div>
      <div class="result-row"><span>Average RL</span><span class="result-val">${(elevPts.reduce((a,p)=>a+(+p.rl),0)/elevPts.length).toFixed(3)} m</span></div>
      ` : '<div class="text-muted" style="padding:4px">Add points with RL values to see elevation stats</div>'}
    </div>
  </div>`;

  setTimeout(() => drawContourMap(elevPts), 100);
}

function drawContourMap(pts) {
  const canvas = document.getElementById('contourCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#f8fbfe';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!pts.length) {
    ctx.fillStyle = '#64748b';
    ctx.font = '14px sans-serif';
    ctx.fillText('No elevation data. Add points with Easting, Northing, and RL values.', 30, 220);
    return;
  }

  const pad  = 60;
  const W    = canvas.width  - pad * 2;
  const H    = canvas.height - pad * 2;
  const Es   = pts.map(p => +p.easting);
  const Ns   = pts.map(p => +p.northing);
  const RLs  = pts.map(p => +p.rl);
  const minE = Math.min(...Es), maxE = Math.max(...Es);
  const minN = Math.min(...Ns), maxN = Math.max(...Ns);
  const minRL= Math.min(...RLs), maxRL = Math.max(...RLs);
  const rlRange = maxRL - minRL || 1;

  const toX  = e => pad + ((e-minE)/(maxE-minE||1)) * W;
  const toY  = n => pad + H - ((n-minN)/(maxN-minN||1)) * H;

  // Elevation color: blue (low) → green → yellow → red (high)
  function elevColor(rl) {
    const t = (rl - minRL) / rlRange;
    const r = Math.round(t < 0.5 ? t*2*255 : 255);
    const g = Math.round(t < 0.5 ? 200 : (1-t)*2*200);
    const b = Math.round(t < 0.5 ? (1-t*2)*200 : 0);
    return `rgb(${r},${g},${b})`;
  }

  // Draw "elevation heatmap" — filled circles
  pts.forEach(p => {
    const x   = toX(+p.easting), y = toY(+p.northing);
    const col = elevColor(+p.rl);
    const rad = 30;
    const grad = ctx.createRadialGradient(x,y,0, x,y,rad);
    grad.addColorStop(0, col + '');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
  });

  // Draw point markers + labels
  pts.forEach(p => {
    const x = toX(+p.easting), y = toY(+p.northing);
    ctx.fillStyle = elevColor(+p.rl);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#0d2137';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText(p.name, x+8, y-5);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px monospace';
    ctx.fillText('RL:'+p.rl, x+8, y+8);
  });

  // Legend
  const lgW = 120, lgH = 12;
  const lgX = canvas.width - pad - lgW, lgY = pad - 20;
  const grad = ctx.createLinearGradient(lgX,0,lgX+lgW,0);
  grad.addColorStop(0, elevColor(minRL));
  grad.addColorStop(0.5, elevColor((minRL+maxRL)/2));
  grad.addColorStop(1, elevColor(maxRL));
  ctx.fillStyle = grad;
  ctx.fillRect(lgX, lgY, lgW, lgH);
  ctx.strokeStyle = '#b0c4d8'; ctx.lineWidth = 1;
  ctx.strokeRect(lgX, lgY, lgW, lgH);
  ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
  ctx.fillText(minRL.toFixed(1)+'m', lgX, lgY+26);
  ctx.fillText(maxRL.toFixed(1)+'m', lgX+lgW-30, lgY+26);
  ctx.fillText('Elevation', lgX+35, lgY-4);
}
